services:
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: shophub-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - shophub-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s  
  api:
    image: shophub-api:latest
    container_name: shophub-api
    ports:
      - "8080:80"
    build:
      context: .
      dockerfile: ShopHub.API/Dockerfile
    depends_on:
      sql-server:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development

              

volumes:
  shophub-db-data: